<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Postal Code Details</title>
<meta name="robots" content="noindex, follow">
<meta name="description" content="View postal code details including area, district, state and country information.">

<!-- Google Analytics (ALLOWED) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-5644DXJGXX"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-5644DXJGXX', { anonymize_ip: true });
</script>

<style>
body{
margin:0;font-family:Arial;background:#f4f6f8;color:#222
}
.container{
max-width:800px;margin:40px auto;background:#fff;
padding:30px;border-radius:12px
}
h1{text-align:center}
.info{
margin-top:20px;font-size:16px;line-height:1.6
}
.label{font-weight:bold}
.row{margin-bottom:10px}
.back{
display:inline-block;margin-top:25px;
padding:12px 18px;background:#007bff;
color:#fff;text-decoration:none;border-radius:8px
}
.note{
margin-top:30px;font-size:14px;color:#666
}
</style>
</head>

<body>

<div class="container">

<h1>📍 Postal Code Details</h1>

<div id="details" class="info"></div>

<a href="search.html" class="back">← Search Another Postal Code</a>

<p class="note">
This information is provided for reference purposes only. Postal code data may vary by location
and postal authority.
</p>

</div>

<script>
const params = new URLSearchParams(location.search);
const country = params.get("country") || "";
const pin = params.get("pin") || "";
const name = params.get("name") || "";
const district = params.get("district") || "";
const state = params.get("state") || "";
const place = params.get("place") || "";

let html = "";

if(country){
html += `<div class="row"><span class="label">Country:</span> ${country}</div>`;
}
if(pin){
html += `<div class="row"><span class="label">Postal Code:</span> ${pin}</div>`;
}
if(name){
html += `<div class="row"><span class="label">Post Office / Area:</span> ${name}</div>`;
}
if(place){
html += `<div class="row"><span class="label">City / Place:</span> ${place}</div>`;
}
if(district){
html += `<div class="row"><span class="label">District:</span> ${district}</div>`;
}
if(state){
html += `<div class="row"><span class="label">State / Region:</span> ${state}</div>`;
}

if(!html){
html = "<p>No postal code details available.</p>";
}

document.getElementById("details").innerHTML = html;

gtag("event","view_postal_detail",{country, pin});
</script>

</body>
</html>
