<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Postal Code Details | Map & Location</title>
<meta name="description" content="View postal code details with location map and nearby area information.">

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6f8;
}

.container{
  max-width:900px;
  margin:40px auto;
  padding:0 15px;
}

.card{
  background:#fff;
  padding:25px;
  border-radius:14px;
  box-shadow:0 6px 18px rgba(0,0,0,.12);
}

.header{
  display:flex;
  align-items:center;
  gap:10px;
}

.flag{
  font-size:32px;
}

h1{margin:0;font-size:26px}
.subtitle{color:#555;margin-top:6px}

.map{
  height:320px;
  margin-top:18px;
  border-radius:12px;
  overflow:hidden;
}
.map iframe{
  width:100%;
  height:100%;
  border:0;
}

/* Credit */
.credit{
  background:#e6f4ea;
  padding:20px;
  border-radius:12px;
  margin-top:25px;
}
.credit h3{margin-top:0;color:#198754}
.credit a{
  display:block;
  background:#198754;
  color:#fff;
  padding:14px;
  text-align:center;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
  margin-top:12px;
}

.back{
  display:inline-block;
  margin-top:20px;
  text-decoration:none;
  color:#0d6efd;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <div class="header">
      <div id="flag" class="flag">🌍</div>
      <div>
        <h1 id="title"></h1>
        <div id="desc" class="subtitle"></div>
      </div>
    </div>

    <div class="map">
      <iframe id="map" loading="lazy"></iframe>
    </div>

    <div class="credit">
      <h3>💳 Check Your Free Credit Score</h3>
      <p style="font-size:14px">
        Get your CIBIL credit score instantly.<br>
        Free & secure via Paisabazaar.
      </p>
      <a href="https://www.paisabazaar.com/?affid=PB005260220213"
         target="_blank" rel="nofollow sponsored">
        Check Free Credit Score
      </a>
    </div>

    <a href="index.html" class="back">← Back to Search</a>

  </div>
</div>

<script>
const p = new URLSearchParams(location.search);

const FLAGS = {
  IN:"🇮🇳", US:"🇺🇸", GB:"🇬🇧", CA:"🇨🇦",
  AU:"🇦🇺", DE:"🇩🇪", FR:"🇫🇷", JP:"🇯🇵"
};

const country = p.get("country") || "";
const flag = document.getElementById("flag");
const title = document.getElementById("title");
const desc = document.getElementById("desc");
const map = document.getElementById("map");

flag.textContent = FLAGS[country] || "🌍";

if(country === "IN"){
  const name = p.get("name") || "";
  const pin = p.get("pin") || "";
  const district = p.get("district") || "";
  const state = p.get("state") || "";

  title.textContent = `${name} – ${pin}`;
  desc.textContent = `${district}, ${state}`;

  map.src =
    `https://www.google.com/maps?q=${encodeURIComponent(
      name + "," + district + "," + state
    )}&output=embed`;
}else{
  const pin = p.get("pin") || "Postal Code";
  const place = p.get("place") || "";
  const state = p.get("state") || "";

  title.textContent = pin;
  desc.textContent = `${place}${state ? ", " + state : ""}`;

  map.src =
    `https://www.google.com/maps?q=${encodeURIComponent(
      place || pin
    )}&output=embed`;
}
</script>

</body>
</html>
