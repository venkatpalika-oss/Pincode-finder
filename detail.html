<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title id="seoTitle">Postal Code Details</title>
<meta name="description" id="seoDesc">

<style>
body{font-family:Arial;background:#f4f6f8;margin:0}
.box{max-width:800px;margin:40px auto;background:#fff;padding:25px;border-radius:12px}
.map{height:300px;margin-top:15px}
.map iframe{width:100%;height:100%;border:0}
.credit{background:#e6f4ea;padding:15px;border-radius:8px;margin-top:25px}
.credit a{
display:block;background:#198754;color:#fff;padding:14px;
border-radius:6px;text-align:center;text-decoration:none;font-weight:600
}
</style>
</head>

<body>

<div class="box">
<h1 id="title"></h1>
<p id="desc"></p>

<div class="map"><iframe id="map" loading="lazy"></iframe></div>

<div class="credit">
<h3>💳 Free Credit Score</h3>
<a href="https://www.paisabazaar.com/?affid=PB005260220213" target="_blank" rel="nofollow sponsored">
Check Now
</a>
</div>
</div>

<script>
const p=new URLSearchParams(location.search);
const t=title,d=desc,m=map;

if(p.get("country")==="IN"){
 t.textContent=`${p.get("name")} – ${p.get("pin")}`;
 d.textContent=`${p.get("district")}, ${p.get("state")}`;
 m.src=`https://www.google.com/maps?q=${encodeURIComponent(p.get("name")+","+p.get("district")+","+p.get("state"))}&output=embed`;
 seoTitle.textContent=`${p.get("name")} ${p.get("pin")} Pincode`;
 seoDesc.content=`${p.get("name")} pincode ${p.get("pin")} in ${p.get("district")}, ${p.get("state")}.`;
}else{
 t.textContent=p.get("pin")||"Postal Code";
 d.textContent=`${p.get("place")}, ${p.get("state")}`;
 m.src=`https://www.google.com/maps?q=${encodeURIComponent(p.get("place")+","+p.get("state"))}&output=embed`;
 seoTitle.textContent=`${p.get("pin")} Postal Code – ${p.get("place")}`;
 seoDesc.content=`Postal code ${p.get("pin")} details for ${p.get("place")}, ${p.get("state")}.`;
}
</script>

</body>
</html>
