<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title id="seoTitle">Postal Code Details</title>
<meta name="description" id="seoDesc">

<style>
body{font-family:Arial;background:#f4f6f8;margin:0}
.box{
  max-width:800px;
  margin:40px auto;
  background:#fff;
  padding:25px;
  border-radius:12px
}
.map{height:300px;margin-top:15px}
.map iframe{width:100%;height:100%;border:0}

/* Services */
.services-list{margin-top:10px}
.service{
  padding:10px;
  border-bottom:1px solid #eee
}
.yes{color:green;font-weight:600}
.no{color:red;font-weight:600}

/* Credit */
.credit{
  background:#e6f4ea;
  padding:15px;
  border-radius:8px;
  margin-top:25px
}
.credit a{
  display:block;
  background:#198754;
  color:#fff;
  padding:14px;
  border-radius:6px;
  text-align:center;
  text-decoration:none;
  font-weight:600
}
</style>
</head>

<body>

<div class="box">
  <h1 id="title"></h1>
  <p id="desc"></p>

  <div class="map">
    <iframe id="map" loading="lazy"></iframe>
  </div>

  <!-- SERVICES SECTION -->
  <h2>📦 Services Available</h2>
  <div id="services">
    <p>Loading services…</p>
  </div>

  <div class="credit">
    <h3>💳 Free Credit Score</h3>
    <a href="https://www.paisabazaar.com/?affid=PB005260220213"
       target="_blank" rel="nofollow sponsored">
      Check Now
    </a>
  </div>
</div>

<script>
/* ---------- EXISTING LOGIC ---------- */
const p = new URLSearchParams(location.search);
const t = title, d = desc, m = map;

if (p.get("country") === "IN") {
  t.textContent = `${p.get("name")} – ${p.get("pin")}`;
  d.textContent = `${p.get("district")}, ${p.get("state")}`;
  m.src = `https://www.google.com/maps?q=${encodeURIComponent(
    p.get("name") + "," + p.get("district") + "," + p.get("state")
  )}&output=embed`;

  seoTitle.textContent = `${p.get("name")} ${p.get("pin")} Pincode`;
  seoDesc.content =
    `${p.get("name")} pincode ${p.get("pin")} in ` +
    `${p.get("district")}, ${p.get("state")}.`;
} else {
  t.textContent = p.get("pin") || "Postal Code";
  d.textContent = `${p.get("place")}, ${p.get("state")}`;
  m.src = `https://www.google.com/maps?q=${encodeURIComponent(
    p.get("place") + "," + p.get("state")
  )}&output=embed`;

  seoTitle.textContent = `${p.get("pin")} Postal Code – ${p.get("place")}`;
  seoDesc.content =
    `Postal code ${p.get("pin")} details for ` +
    `${p.get("place")}, ${p.get("state")}.`;
}

/* ---------- PINCODE SERVICES LOGIC ---------- */
const pin = p.get("pin");

fetch("services.json")
  .then(r => r.json())
  .then(data => {
    const box = document.getElementById("services");
    const list = data[pin];

    if (!list) {
      box.innerHTML =
        "<p>No service information available for this postal code.</p>";
      return;
    }

    box.innerHTML = '<div class="services-list"></div>';
    const wrap = box.querySelector(".services-list");

    list.forEach(s => {
      wrap.innerHTML += `
        <div class="service">
          <strong>${s.name}</strong> :
          <span class="${s.available ? 'yes' : 'no'}">
            ${s.available ? 'Available' : 'Not Available'}
          </span>
          ${s.eta ? ` | ${s.eta}` : ""}
          ${s.price ? ` | ${s.price}` : ""}
        </div>
      `;
    });
  })
  .catch(() => {
    document.getElementById("services").innerHTML =
      "<p>Error loading service data.</p>";
  });
</script>

</body>
</html>
