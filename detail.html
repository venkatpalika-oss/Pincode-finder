<style>
body{font-family:Arial;background:#f4f6f8;margin:0}

.map{height:300px;margin-top:15px}
.map iframe{width:100%;height:100%;border:0}
.credit{background:#e6f4ea;padding:15px;border-radius:8px;margin-top:20px}
.credit a{display:block;background:#198754;color:#fff;padding:12px;text-align:center;border-radius:6px;text-decoration:none}
</style>
</head>

<body>
<div class="box">
<h1 id="title"></h1>
<p id="desc"></p>

<div class="map"><iframe id="map"></iframe></div>

<!-- ✅ AdSense: Detail page -->
<div style="margin:20px 0;text-align:center">

 style="display:block"

target="_blank" rel="nofollow sponsored">Check Now</a>

<script>
const p=new URLSearchParams(location.search);
if(p.get("country")==="IN"){
 title.textContent=`${p.get("name")} – ${p.get("pin")}`;
 desc.textContent=`${p.get("district")}, ${p.get("state")}`;
 map.src=`https://www.google.com/maps?q=${encodeURIComponent(p.get("name")+","+p.get("district"))}&output=embed`;
}else{
 title.textContent=p.get("pin")||"Postal Code";
 desc.textContent=`${p.get("place")}, ${p.get("state")}`;
 map.src=`https://www.google.com/maps?q=${encodeURIComponent(p.get("place"))}&output=embed`;
}
</script>
