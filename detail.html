<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Postal Code Details</title>
<meta name="description" content="View detailed postal code information including area, district, state and country.">

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-5644DXJGXX"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-5644DXJGXX', { anonymize_ip: true });
</script>

<style>
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:#f4f6f8;
  color:#222;
}
.container{
  max-width:820px;
  margin:40px auto;
  background:#fff;
  padding:35px;
  border-radius:14px;
}
h1{
  text-align:center;
  margin-bottom:10px;
}
.subtitle{
  text-align:center;
  color:#555;
  font-size:14px;
  margin-bottom:30px;
}
.info{
  font-size:16px;
  line-height:1.7;
}
.row{
  padding:10px 0;
  border-bottom:1px solid #eee;
}
.label{
  font-weight:600;
  display:inline-block;
  width:160px;
}
.back{
  display:inline-block;
  margin-top:30px;
  padding:14px 22px;
  background:#0d6efd;
  color:#fff;
  text-decoration:none;
  border-radius:10px;
  font-weight:600;
}
.note{
  margin-top:35px;
  font-size:14px;
  color:#666;
}
</style>
</head>

<body>

<div class="container">

<h1 id="title">📍 Postal Code Details</h1>
<p class="subtitle" id="subtitle"></p>

<div id="details" class="info"></div>

<a href="search.html" class="back">← Search Another Postal Code</a>

<p class="note">
This postal code information is provided for reference only. Always verify with the
official postal authority for critical deliveries or documentation.
</p>

</div>

<script>
const params = new URLSearchParams(location.search);

const country = params.get("country") || "";
const pin = params.get("pin") || "";
const name = params.get("name") || "";
const district = params.get("district") || "";
const state = params.get("state") || "";
const place = params.get("place") || "";

const details = document.getElementById("details");
const titleEl = document.getElementById("title");
const subtitleEl = document.getElementById("subtitle");

let rows = "";

// Dynamic title & meta description (SEO)
let titleParts = [];
if(pin) titleParts.push(pin);
if(place) titleParts.push(place);
if(state) titleParts.push(state);

if(titleParts.length){
  const t = titleParts.join(" – ");
  document.title = t + " Postal Code Details";
  document.querySelector("meta[name=description]")
    .setAttribute("content",`Postal code ${pin} details for ${place || name}, ${state || ""}. Includes area, district and country information.`);
  titleEl.textContent = "📍 " + t;
  subtitleEl.textContent = "Detailed postal code information";
}

// Details table
if(country) rows += `<div class="row"><span class="label">Country</span> ${country}</div>`;
if(pin) rows += `<div class="row"><span class="label">Postal Code</span> ${pin}</div>`;
if(name) rows += `<div class="row"><span class="label">Post Office / Area</span> ${name}</div>`;
if(place) rows += `<div class="row"><span class="label">City / Place</span> ${place}</div>`;
if(district) rows += `<div class="row"><span class="label">District</span> ${district}</div>`;
if(state) rows += `<div class="row"><span class="label">State / Region</span> ${state}</div>`;

details.innerHTML = rows || "<p>No postal code details available.</p>";

// Schema.org PostalAddress
if(pin){
const schema = {
  "@context": "https://schema.org",
  "@type": "PostalAddress",
  "postalCode": pin,
  "addressLocality": place || name || "",
  "addressRegion": state || "",
  "addressCountry": country || ""
};
const s = document.createElement("script");
s.type = "application/ld+json";
s.textContent = JSON.stringify(schema);
document.head.appendChild(s);
}

// Analytics
gtag("event","view_postal_detail",{
  country: country,
  postal_code: pin
});
</script>

</body>
</html>
