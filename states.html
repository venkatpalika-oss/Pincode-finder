<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>India States Pincode Directory | Pincode4U</title>

<meta name="description"
content="Browse all Indian states and find postal PIN codes, cities, districts and post offices. Complete India pincode directory." />

<meta name="keywords"
content="india states pincode, state wise pincode directory, indian postal code states, india pincode list" />

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

<h1>India State Pincode Directory</h1>

<p>Browse all states to find cities, districts and postal PIN codes.</p>

</header>

<div class="container">

<div class="card">

<h2>All Indian States</h2>

<div id="stateList"></div>

</div>

</div>

<script>

fetch("locations.json")
.then(res => res.json())
.then(data => {

const states = new Set()

for(const pin in data){

states.add(data[pin].state)

}

const stateArray = [...states].sort()

const container = document.getElementById("stateList")

stateArray.forEach(state => {

const slug = state.toLowerCase().replace(/\s+/g,"-")

const link = document.createElement("a")

link.href = "/state/" + slug + ".html"

link.textContent = state

container.appendChild(link)

})

})

</script>

</body>
</html>
