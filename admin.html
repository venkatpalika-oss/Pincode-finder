<!DOCTYPE html>
<html>
<head>
<title>Service Admin</title>
<meta name="robots" content="noindex, nofollow">
<style>
body{font-family:Arial;padding:20px}
input,button{padding:10px;margin:5px}
textarea{width:100%;height:300px}
</style>
</head>
<body>

<h2>Service Data Admin</h2>

<button onclick="loadData()">Load Data</button>
<button onclick="save()">Download Updated JSON</button>
<p id="status"></p>

<textarea id="json"></textarea>

<script>
function loadData(){
  document.getElementById('status').textContent = 'Loading...';
  fetch("locations.json")
  .then(r=>r.text())
  .then(t=>{
    json.value = t;
    document.getElementById('status').textContent = 'Loaded.';
  })
  .catch(e=>{
    document.getElementById('status').textContent = 'Failed to load: ' + e.message;
  });
}

function save(){
  const blob=new Blob([json.value],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="locations.json";
  a.click();
}
</script>

</body>
</html>
