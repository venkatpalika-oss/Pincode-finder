<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Global Postal Code Finder | India Pincode & ZIP Codes</title>
<meta name="description" content="Find Indian pincodes by city and international ZIP/postal codes with maps. Free and fast.">

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9595967643816732" crossorigin="anonymous"></script>

<style>
body{font-family:Arial;background:#f4f6f8;margin:0}
.container{max-width:900px;margin:40px auto;background:#fff;padding:30px;border-radius:10px}
h1{text-align:center}
.subtitle{text-align:center;color:#666}
input,button{width:100%;padding:14px;font-size:16px;border-radius:6px}
button{background:#007bff;color:#fff;border:none;margin-top:12px}
.card{background:#f1f5ff;padding:15px;border-radius:8px;margin-top:10px;cursor:pointer}
.flag{font-size:22px;margin-right:6px}
.error{text-align:center;color:red;margin-top:10px}
.credit-side{position:fixed;right:20px;top:120px;width:250px;background:#e6f4ea;padding:15px;border-radius:10px}
.credit-side a{display:block;background:#198754;color:#fff;padding:12px;text-align:center;border-radius:6px;text-decoration:none}
@media(max-width:900px){.credit-side{display:none}}
</style>
</head>

<body>

<div class="container">
<h1>🌍 Global Postal Code Finder</h1>
<p class="subtitle">India City → Pincode | International ZIP → Place</p>

<input id="q" placeholder="Enter Indian city or ZIP / Postal code">
<button onclick="search()">Search</button>

<div id="result"></div>
<div id="error" class="error"></div>
</div>

<div class="credit-side">
<h3>💳 Free Credit Score</h3>
<a href="https://www.paisabazaar.com/?affid=PB005260220213" target="_blank">Check Now</a>
</div>

<script>
const flags={IN:"🇮🇳",US:"🇺🇸",GB:"🇬🇧",CA:"🇨🇦",AU:"🇦🇺",DE:"🇩🇪",FR:"🇫🇷"};

function detect(q){
 if(/^\d{6}$/.test(q)) return "IN";
 if(/^\d{5}$/.test(q)) return "US";
 if(/^[A-Z]{1,2}\d[A-Z\d]?\s?\d[A-Z]{2}$/i.test(q)) return "GB";
 if(/^[A-Z]\d[A-Z]\s?\d[A-Z]\d$/i.test(q)) return "CA";
 return "IN";
}

async function search(){
 const q=document.getElementById("q").value.trim();
 const r=document.getElementById("result");
 const e=document.getElementById("error");
 r.innerHTML=""; e.textContent="";
 if(!q) return;

 try{
  const c=detect(q);
  if(c==="IN"){
   const url=/^\d{6}$/.test(q)
    ?`https://api.postalpincode.in/pincode/${q}`
    :`https://api.postalpincode.in/postoffice/${encodeURIComponent(q)}`;
   const d=await (await fetch(url)).json();
   if(d[0].Status!=="Success") throw "";
   r.innerHTML=d[0].PostOffice.map(o=>`
    <div class="card" onclick="goIN('${o.Name}','${o.Pincode}','${o.District}','${o.State}')">
     <span class="flag">${flags.IN}</span>
     <strong>${o.Name} – ${o.Pincode}</strong><br>
     ${o.District}, ${o.State}
    </div>`).join("");
  }else{
   const d=await (await fetch(`https://api.zippopotam.us/${c}/${q}`)).json();
   r.innerHTML=`
    <div class="card" onclick="goINT('${c}','${d['post code']}','${d.places[0]['place name']}','${d.places[0].state}')">
     <span class="flag">${flags[c]}</span>
     <strong>${d['post code']}</strong><br>
     ${d.places[0]['place name']}, ${d.places[0].state}
    </div>`;
  }
 }catch{
  e.textContent="No results found. Try ZIP/Postal code for international search.";
 }
}

function goIN(n,p,d,s){
 location.href=`detail.html?country=IN&name=${encodeURIComponent(n)}&pin=${p}&district=${encodeURIComponent(d)}&state=${encodeURIComponent(s)}`;
}
function goINT(c,p,pl,s){
 location.href=`detail.html?country=${c}&pin=${p}&place=${encodeURIComponent(pl)}&state=${encodeURIComponent(s)}`;
}
</script>

</body>
</html>
