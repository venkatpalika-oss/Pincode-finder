<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Global Postal Code Finder | India Pincode & International ZIP Codes</title>
<meta name="description" content="Search Indian pincodes and international postal codes by country. Fast, accurate, and free.">

<script async src="https://pagead2.googlesyndication.com/pagead/jsadsbygoogle.js?client=ca-pub-9595967643816732" crossorigin="anonymous"></script>

<style>
body{font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;margin:0}
.container{max-width:900px;margin:50px auto;background:#fff;padding:30px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.1)}
h1{text-align:center}
.subtitle{text-align:center;color:#666;font-size:14px}

input,select,button{
width:100%;
padding:14px;
font-size:16px;
border-radius:6px;
margin-top:10px;
}

input,select{border:1px solid #ccc}

button{background:#007bff;color:#fff;border:none;cursor:pointer}
button:hover{background:#0056b3}

.section{margin-top:25px}
.card{
background:#f1f5ff;
padding:15px;
border-radius:8px;
margin-bottom:12px;
cursor:pointer
}
.card a{text-decoration:none;color:inherit;display:block}
.error{text-align:center;color:red;margin-top:15px}

/* Credit Score */
.credit-side{
position:fixed;right:20px;top:120px;width:260px;
background:#e6f4ea;padding:15px;border-radius:10px;
box-shadow:0 4px 8px rgba(0,0,0,.15)
}
.credit-side a{
display:block;text-align:center;background:#198754;color:#fff;
padding:14px;border-radius:6px;text-decoration:none;font-weight:600;
animation:pulse 2.5s infinite
}

/* Mobile CTA */
.mobile-cta{
display:none;position:fixed;bottom:0;left:0;right:0;
background:#198754;color:#fff;text-align:center;padding:14px;
font-weight:600;text-decoration:none
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.05)}
100%{transform:scale(1)}
}

@media(max-width:900px){
.credit-side{display:none}
.mobile-cta{display:block}
}
</style>
</head>

<body>

<div class="container">
<h1>🌍 Global Postal Code Finder</h1>
<p class="subtitle">India Pincode & International ZIP / Postal Codes</p>

<!-- INDIA SEARCH -->
<div class="section">
<h3>🇮🇳 India Search</h3>
<input id="indiaInput" placeholder="Enter city or 6-digit pincode">
<button onclick="searchIndia()">Search India</button>
</div>

<!-- INTERNATIONAL SEARCH -->
<div class="section">
<h3>🌍 International Search</h3>
<select id="country">
<option value="">Select Country</option>
<option value="US">United States</option>
<option value="GB">United Kingdom</option>
<option value="CA">Canada</option>
<option value="AU">Australia</option>
<option value="DE">Germany</option>
<option value="FR">France</option>
</select>

<input id="intlInput" placeholder="Enter postal / zip code">
<button onclick="searchIntl()">Search International</button>
</div>

<div id="result"></div>
<div id="error" class="error"></div>
</div>

<!-- Credit Score Desktop -->
<div class="credit-side">
<h3>💳 Free Credit Score</h3>
<a href="https://www.paisabazaar.com/?affid=PB005260220213" target="_blank" rel="nofollow sponsored">
Check Now
</a>
</div>

<!-- Mobile CTA -->
<a class="mobile-cta" href="https://www.paisabazaar.com/?affid=PB005260220213" target="_blank">
💳 Check Free Credit Score
</a>

<script>
async function searchIndia(){
const q=document.getElementById("indiaInput").value.trim();
const result=document.getElementById("result");
const error=document.getElementById("error");
result.innerHTML=""; error.textContent="";
if(!q) return;

try{
const url=/^\d{6}$/.test(q)
?`https://api.postalpincode.in/pincode/${q}`
:`https://api.postalpincode.in/postoffice/${encodeURIComponent(q)}`;

const data=await (await fetch(url)).json();
if(data[0].Status!=="Success") throw "";

result.innerHTML=data[0].PostOffice.map(o=>`
<div class="card">
<a href="detail.html?country=IN&pin=${o.Pincode}&name=${encodeURIComponent(o.Name)}&district=${encodeURIComponent(o.District)}&state=${encodeURIComponent(o.State)}">
<strong>${o.Name} – ${o.Pincode}</strong><br>
${o.District}, ${o.State}
</a>
</div>
`).join("");
}catch{
error.textContent="No results found.";
}
}

async function searchIntl(){
const c=document.getElementById("country").value;
const q=document.getElementById("intlInput").value.trim();
const result=document.getElementById("result");
const error=document.getElementById("error");
result.innerHTML=""; error.textContent="";
if(!c||!q) return;

try{
const data=await (await fetch(`https://api.zippopotam.us/${c}/${q}`)).json();
const p=data.places[0];

result.innerHTML=`
<div class="card">
<a href="detail.html?country=${c}&pin=${data['post code']}&place=${encodeURIComponent(p['place name'])}&state=${encodeURIComponent(p.state)}">
<strong>${data['post code']}</strong><br>
${p['place name']}, ${p.state}
</a>
</div>`;
}catch{
error.textContent="No results found.";
}
}
</script>

</body>
</html>
