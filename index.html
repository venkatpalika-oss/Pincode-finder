<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indian Pincode & Place Finder</title>
  <meta name="description" content="Search Indian pincodes or place names using official India Post data. Fast, accurate, and cached for better performance." />

  <!-- AdSense performance -->
  <link rel="preconnect" href="https://pagead2.googlesyndication.com">
  <link rel="preconnect" href="https://googleads.g.doubleclick.net">

  <!-- Google AdSense -->
  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9595967643816732"
    crossorigin="anonymous"></script>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      margin: 0;
    }
    main.container {
      max-width: 720px;
      margin: 60px auto;
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 { text-align:center; color:#333; }
    h2.subtitle { text-align:center; color:#666; font-size:14px; }

    input, button {
      width:100%;
      padding:14px;
      font-size:16px;
      border-radius:6px;
    }
    input { border:1px solid #ccc; }
    button {
      margin-top:12px;
      background:#007bff;
      color:#fff;
      border:none;
      cursor:pointer;
    }
    button:hover { background:#0056b3; }
    .clear-cache { background:#28a745; }

    .adsense { margin:20px 0; text-align:center; min-height:90px; }

    .result {
      display:none;
      margin-top:20px;
      background:#f1f5ff;
      padding:20px;
      border-radius:8px;
    }

    .error {
      color:red;
      text-align:center;
      margin-top:15px;
    }

    .map-container {
      height:250px;
      margin-top:10px;
      border-radius:6px;
      overflow:hidden;
    }
    .map-container iframe {
      width:100%;
      height:100%;
      border:0;
    }

    footer {
      text-align:center;
      margin:40px 0;
      color:#777;
      font-size:14px;
    }
  </style>
</head>

<body>

<main class="container">
  <h1>Indian Pincode & Place Finder</h1>
  <h2 class="subtitle">Search by Pincode or Place Name</h2>

  <input id="searchInput"
         aria-label="Search pincode or place"
         placeholder="Enter 6-digit Pincode or Place Name" />

  <button onclick="handleSearch()">Search</button>
  <button class="clear-cache" onclick="clearCache()">Clear Cache</button>

  <p style="font-size:14px;color:#555;margin-top:15px;">
    Find accurate Indian pincode details including post office name, district,
    state, and branch type using official India Post data.
  </p>

  <!-- Above-the-fold ad -->
  <div class="adsense">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-9595967643816732"
         data-ad-slot="1234567890"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
  </div>

  <div id="result" class="result"></div>

  <!-- In-content ad -->
  <div id="adsenseContainer" class="adsense"></div>

  <div id="error" class="error"></div>
</main>

<footer>
  © 2026 Pincode Finder
  <div class="adsense">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-9595967643816732"
         data-ad-slot="9876543210"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
  </div>
</footer>

<script>
  (adsbygoogle = window.adsbygoogle || []).push({});

  async function handleSearch() {
    const input = document.getElementById("searchInput");
    const resultBox = document.getElementById("result");
    const errorBox = document.getElementById("error");
    const adsBox = document.getElementById("adsenseContainer");

    const query = input.value.trim();
    if (!query) {
      errorBox.textContent = "Please enter a pincode or place name.";
      return;
    }

    errorBox.textContent = "";
    resultBox.style.display = "block";
    resultBox.innerHTML = "Loading...";

    try {
      const isPincode = /^\d{6}$/.test(query);
      const apiUrl = isPincode
        ? `https://api.postalpincode.in/pincode/${query}`
        : `https://api.postalpincode.in/postoffice/${encodeURIComponent(query)}`;

      const response = await fetch(apiUrl);
      const data = await response.json();

      if (data[0].Status !== "Success" || !data[0].PostOffice) {
        resultBox.style.display = "none";
        errorBox.textContent = "No results found.";
        return;
      }

      resultBox.innerHTML = data[0].PostOffice.map(o => `
        <div style="margin-bottom:20px;">
          <strong>${o.Name}</strong><br>
          ${o.District}, ${o.State} – ${o.Pincode}
          <div class="map-container">
            <iframe loading="lazy"
              src="https://www.google.com/maps?q=${encodeURIComponent(o.Name + ',' + o.District + ',' + o.State)}&output=embed">
            </iframe>
          </div>
        </div>
      `).join("");

      adsBox.innerHTML = `
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-9595967643816732"
             data-ad-slot="1234567890"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>`;
      (adsbygoogle = window.adsbygoogle || []).push({});

    } catch (err) {
      console.error(err);
      resultBox.style.display = "none";
      errorBox.textContent = "Unable to fetch data. Please try again later.";
    }
  }

  function clearCache() {
    localStorage.clear();
    alert("Cache cleared");
  }

  document.getElementById("searchInput").addEventListener("keypress", e => {
    if (e.key === "Enter") handleSearch();
  });
</script>

</body>
</html>
