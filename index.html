<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Global Postal Code Finder | India PIN, ZIP & Postcode</title>
<meta name="description" content="Find Indian PIN codes and international ZIP / postal codes with country flags and maps.">

<style>
body{font-family:Arial;background:#f4f6f8;margin:0}
.container{max-width:900px;margin:40px auto;background:#fff;padding:25px;border-radius:10px}
h1{text-align:center}
.subtitle{text-align:center;color:#666;font-size:14px}
input,button{width:100%;padding:14px;font-size:16px;border-radius:6px;margin-top:10px}
button{background:#007bff;color:#fff;border:none;cursor:pointer}
.card{padding:12px;border-bottom:1px solid #ddd;cursor:pointer}
.card:hover{background:#f1f5ff}
.error{text-align:center;color:red;margin-top:15px}
</style>
</head>

<body>

<div class="container">
<h1>🌍 Global Postal Code Finder</h1>
<p class="subtitle">🇮🇳 India (City / PIN) • 🌍 International (ZIP / Postcode)</p>

<input id="q" placeholder="Enter Indian city or PIN | International ZIP">
<button onclick="search()">Search</button>

<div id="result"></div>
<div id="error" class="error"></div>
</div>

<script>
const FLAGS = {
  IN:"🇮🇳", US:"🇺🇸", GB:"🇬🇧", CA:"🇨🇦",
  AU:"🇦🇺", DE:"🇩🇪", FR:"🇫🇷", IT:"🇮🇹",
  ES:"🇪🇸", NL:"🇳🇱", JP:"🇯🇵"
};

const ZIP_RULES = {
  US:/^\d{5}$/,
  GB:/^[A-Z]{1,2}\d[A-Z\d]?\s?\d[A-Z]{2}$/i,
  CA:/^[A-Z]\d[A-Z]\s?\d[A-Z]\d$/i,
  AU:/^\d{4}$/,
  DE:/^\d{5}$/,
  FR:/^\d{5}$/,
  IT:/^\d{5}$/,
  ES:/^\d{5}$/,
  NL:/^\d{4}\s?[A-Z]{2}$/i,
  JP:/^\d{3}-?\d{4}$/
};

async function search(){
  const q=document.getElementById("q").value.trim();
  const result=document.getElementById("result");
  const error=document.getElementById("error");

  result.innerHTML=""; error.textContent="";
  if(!q) return;

  try{
    // 🇮🇳 INDIA
    if(/^\d{6}$/.test(q) || /^[a-zA-Z\s]{3,}$/.test(q)){
      const url=/^\d{6}$/.test(q)
        ?`https://api.postalpincode.in/pincode/${q}`
        :`https://api.postalpincode.in/postoffice/${encodeURIComponent(q)}`;

      const d=await (await fetch(url)).json();
      if(d[0].Status!=="Success") throw "";

      d[0].PostOffice.forEach(o=>{
        result.innerHTML+=`
        <div class="card" onclick="goIndia(
          '${o.Name}','${o.Pincode}','${o.District}','${o.State}'
        )">
        🇮🇳 <strong>${o.Name}</strong> – ${o.Pincode}<br>
        ${o.District}, ${o.State}
        </div>`;
      });
      return;
    }

    // 🌍 INTERNATIONAL ZIP
    for(const c in ZIP_RULES){
      if(ZIP_RULES[c].test(q)){
        const d=await (await fetch(`https://api.zippopotam.us/${c}/${q}`)).json();
        d.places.forEach(p=>{
          result.innerHTML+=`
          <div class="card" onclick="goIntl(
            '${c}','${q}','${p["place name"]}','${p.state}'
          )">
          ${FLAGS[c]||"🌍"} <strong>${q}</strong><br>
          ${p["place name"]}, ${p.state}
          </div>`;
        });
        return;
      }
    }

    throw "";
  }catch{
    error.textContent="No results found.";
  }
}

function goIndia(name,pin,district,state){
  location.href=`detail.html?country=IN&name=${encodeURIComponent(name)}
  &pin=${pin}&district=${encodeURIComponent(district)}
  &state=${encodeURIComponent(state)}`;
}

function goIntl(country,pin,place,state){
  location.href=`detail.html?country=${country}&pin=${pin}
  &place=${encodeURIComponent(place)}
  &state=${encodeURIComponent(state)}`;
}
</script>

</body>
</html>
