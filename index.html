<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pincode & ZIP Code Finder | India & USA Postal Lookup</title>
<meta name="description" content="Search Indian PIN codes and US ZIP codes by city or area. Get post office, district, state, and location details instantly.">

<style>
body {
  font-family: Arial, Helvetica, sans-serif;
  background:#f4f6f8;
  margin:0;
}

/* Layout */
.wrapper {
  display:flex;
  max-width:1100px;
  margin:40px auto;
  gap:20px;
  padding:0 15px;
}

main {
  flex:3;
  background:#fff;
  padding:25px;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,.1);
}

aside {
  flex:1;
}

/* Headings */
h1 { text-align:center; color:#333; }
.subtitle { text-align:center; color:#666; font-size:14px; margin-bottom:20px; }

/* Inputs */
input, select, button {
  width:100%;
  padding:14px;
  font-size:16px;
  border-radius:6px;
  margin-top:10px;
}

input, select { border:1px solid #ccc; }

button {
  background:#007bff;
  color:#fff;
  border:none;
  cursor:pointer;
}
button:hover { background:#0056b3; }

/* Result list */
.list-item {
  padding:12px;
  border-bottom:1px solid #ddd;
  cursor:pointer;
}
.list-item:hover {
  background:#f1f5ff;
}

/* Details */
.result-box {
  margin-top:15px;
  background:#f1f5ff;
  padding:15px;
  border-radius:8px;
}

.map {
  margin-top:10px;
  height:250px;
}
.map iframe {
  width:100%;
  height:100%;
  border:0;
}

.error {
  color:red;
  margin-top:15px;
  text-align:center;
}

/* Credit Card */
.credit-card {
  background:#e6f4ea;
  padding:20px;
  border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,.08);
}
.credit-card h3 {
  color:#198754;
  margin-bottom:10px;
}
.credit-card p {
  font-size:14px;
  color:#333;
}
.credit-card a {
  display:block;
  text-align:center;
  margin-top:12px;
  padding:12px;
  background:#198754;
  color:#fff;
  text-decoration:none;
  border-radius:6px;
  font-weight:bold;
}

/* Mobile CTA */
.mobile-cta {
  display:none;
}

@media (max-width:768px) {
  .wrapper {
    flex-direction:column;
  }
  aside {
    display:none;
  }

  .mobile-cta {
    display:flex;
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:#198754;
    color:#fff;
    padding:12px 15px;
    justify-content:space-between;
    align-items:center;
    z-index:9999;
  }
  .mobile-cta a {
    background:#fff;
    color:#198754;
    padding:10px 14px;
    border-radius:6px;
    text-decoration:none;
    font-weight:bold;
  }

  body {
    padding-bottom:70px;
  }
}
</style>
</head>

<body>

<div class="wrapper">

<main>
  <h1>Pincode & ZIP Code Finder</h1>
  <p class="subtitle">Search India PIN codes & US ZIP codes by city or area</p>

  <select id="country">
    <option value="IN">India</option>
    <option value="US">United States</option>
  </select>

  <input id="query" placeholder="Enter Pincode, ZIP Code or City name">
  <button onclick="search()">Search</button>

  <div id="list"></div>
  <div id="details"></div>
  <div id="error" class="error"></div>
</main>

<!-- Desktop Credit Score -->
<aside>
  <div class="credit-card">
    <h3>💳 Free Credit Score</h3>
    <p>
      Check your CIBIL credit score instantly.  
      100% free & secure via Paisabazaar.
    </p>
    <a href="https://www.paisabazaar.com/?affid=PB005260220213"
       target="_blank" rel="nofollow sponsored">
      Check Free Credit Score
    </a>
  </div>
</aside>

</div>

<!-- Mobile Sticky CTA -->
<div class="mobile-cta">
  <span>💳 Free Credit Score</span>
  <a href="https://www.paisabazaar.com/?affid=PB005260220213"
     target="_blank" rel="nofollow sponsored">
    Check Now
  </a>
</div>

<script>
async function search() {
  const q = document.getElementById("query").value.trim();
  const country = document.getElementById("country").value;
  const list = document.getElementById("list");
  const details = document.getElementById("details");
  const error = document.getElementById("error");

  list.innerHTML = "";
  details.innerHTML = "";
  error.textContent = "";

  if (!q) return;

  try {
    if (country === "IN") {
      const isPin = /^\d{6}$/.test(q);
      const url = isPin
        ? `https://api.postalpincode.in/pincode/${q}`
        : `https://api.postalpincode.in/postoffice/${encodeURIComponent(q)}`;

      const res = await fetch(url);
      const data = await res.json();

      if (!data[0] || data[0].Status !== "Success") throw "No data";

      data[0].PostOffice.forEach(o => {
        const div = document.createElement("div");
        div.className = "list-item";
        div.textContent = `${o.Name}, ${o.District} (${o.Pincode})`;
        div.onclick = () => showIndia(o);
        list.appendChild(div);
      });

    } else {
      const res = await fetch(`https://api.zippopotam.us/us/${q}`);
      const data = await res.json();

      data.places.forEach(p => {
        const div = document.createElement("div");
        div.className = "list-item";
        div.textContent = `${p["place name"]}, ${p.state}`;
        div.onclick = () => showUS(p);
        list.appendChild(div);
      });
    }
  } catch {
    error.textContent = "No results found.";
  }
}

function showIndia(o) {
  document.getElementById("details").innerHTML = `
    <div class="result-box">
      <strong>${o.Name}</strong><br>
      ${o.District}, ${o.State}<br>
      PIN Code: ${o.Pincode}
      <div class="map">
        <iframe loading="lazy"
          src="https://www.google.com/maps?q=${encodeURIComponent(o.Name + ',' + o.District)}&output=embed">
        </iframe>
      </div>
    </div>`;
}

function showUS(p) {
  document.getElementById("details").innerHTML = `
    <div class="result-box">
      <strong>${p["place name"]}</strong><br>
      ${p.state}
      <div class="map">
        <iframe loading="lazy"
          src="https://www.google.com/maps?q=${encodeURIComponent(p["place name"] + ',' + p.state)}&output=embed">
        </iframe>
      </div>
    </div>`;
}
</script>

</body>
</html>
