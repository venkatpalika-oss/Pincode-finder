<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Indian Pincode Finder | City-wise Results</title>
  <meta name="description" content="Search Indian pincodes by city or pincode. View multiple pincodes with detailed information and maps." />

  <!-- AdSense -->
  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9595967643816732"
    crossorigin="anonymous"></script>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background:#f4f6f8;
      margin:0;
    }

    main.container {
      max-width:720px;
      margin:60px auto;
      background:#fff;
      padding:30px;
      border-radius:10px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    h1 { text-align:center; color:#333; }
    h2.subtitle { text-align:center; color:#666; font-size:14px; }

    input, button {
      width:100%;
      padding:14px;
      font-size:16px;
      border-radius:6px;
    }

    input { border:1px solid #ccc; }

    button {
      margin-top:12px;
      background:#007bff;
      color:#fff;
      border:none;
      cursor:pointer;
    }

    button:hover { background:#0056b3; }

    .result {
      display:none;
      margin-top:20px;
    }

    details {
      background:#f1f5ff;
      border-radius:8px;
      padding:12px;
      margin-bottom:12px;
      cursor:pointer;
    }

    summary {
      font-weight:600;
      font-size:15px;
      color:#333;
      outline:none;
    }

    .detail-box {
      margin-top:10px;
      font-size:14px;
      color:#333;
    }

    .map-container {
      height:220px;
      margin-top:10px;
    }

    .map-container iframe {
      width:100%;
      height:100%;
      border:0;
    }

    .error {
      color:red;
      text-align:center;
      margin-top:15px;
    }

    footer {
      text-align:center;
      margin:40px 0;
      color:#777;
      font-size:14px;
    }
  </style>
</head>

<body>

<main class="container">
  <h1>Indian Pincode & Place Finder</h1>
  <h2 class="subtitle">Search by City or Pincode</h2>

  <input id="searchInput" placeholder="Enter city name or 6-digit pincode">
  <button onclick="searchPincode()">Search</button>

  <div id="result" class="result"></div>
  <div id="error" class="error"></div>
</main>

<footer>
  © 2026 Pincode Finder
</footer>

<script>
async function searchPincode() {
  const input = document.getElementById("searchInput");
  const result = document.getElementById("result");
  const error = document.getElementById("error");

  const q = input.value.trim();
  if (!q) return;

  result.style.display = "block";
  result.innerHTML = "Loading...";
  error.textContent = "";

  try {
    const isPin = /^\d{6}$/.test(q);
    const url = isPin
      ? `https://api.postalpincode.in/pincode/${q}`
      : `https://api.postalpincode.in/postoffice/${encodeURIComponent(q)}`;

    const response = await fetch(url);
    const data = await response.json();

    if (!data[0] || data[0].Status !== "Success") {
      result.style.display = "none";
      error.textContent = "No results found.";
      return;
    }

    result.innerHTML = data[0].PostOffice.map(o => `
      <details>
        <summary>
          ${o.Name} – ${o.Pincode}
        </summary>

        <div class="detail-box">
          <strong>Post Office:</strong> ${o.Name}<br>
          <strong>Pincode:</strong> ${o.Pincode}<br>
          <strong>District:</strong> ${o.District}<br>
          <strong>State:</strong> ${o.State}<br>
          <strong>Branch Type:</strong> ${o.BranchType}

          <div class="map-container">
            <iframe loading="lazy"
              src="https://www.google.com/maps?q=${encodeURIComponent(o.Name + ',' + o.District + ',' + o.State)}&output=embed">
            </iframe>
          </div>
        </div>
      </details>
    `).join("");

  } catch {
    result.style.display = "none";
    error.textContent = "Unable to fetch data. Please try again.";
  }
}
</script>

</body>
</html>
