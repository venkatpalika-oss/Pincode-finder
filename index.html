<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Postal Code Details</title>

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9595967643816732" crossorigin="anonymous"></script>

<style>
body{font-family:Arial;background:#f4f6f8;margin:0}
.box{max-width:800px;margin:40px auto;background:#fff;padding:25px;border-radius:10px}
.map{height:300px;margin-top:15px}
.map iframe{width:100%;height:100%;border:0}
.credit{background:#e6f4ea;padding:15px;border-radius:8px;margin-top:20px}
.credit a{display:block;text-align:center;background:#198754;color:#fff;padding:14px;border-radius:6px;text-decoration:none}
</style>
</head>

<body>

<div class="box">
<h1 id="title"></h1>
<p id="desc"></p>

<div class="map">
<iframe id="map" loading="lazy"></iframe>
</div>

<div class="credit">
<h3>💳 Check Your Free Credit Score</h3>
<a href="https://www.paisabazaar.com/?affid=PB005260220213" target="_blank">Check Now</a>
</div>
</div>

<script>
const p=new URLSearchParams(location.search);
const type=p.get("type");

if(type==="IN"){
const name=p.get("name");
const pin=p.get("pincode");
const district=p.get("district");
const state=p.get("state");
document.getElementById("title").innerText=`${name} – ${pin}`;
document.getElementById("desc").innerText=`${district}, ${state}`;
document.getElementById("map").src=
`https://www.google.com/maps?q=${encodeURIComponent(name+','+district)}&output=embed`;
}else{
const code=p.get("code");
const place=p.get("place");
const state=p.get("state");
document.getElementById("title").innerText=`${code}`;
document.getElementById("desc").innerText=`${place}, ${state}`;
document.getElementById("map").src=
`https://www.google.com/maps?q=${encodeURIComponent(place+','+state)}&output=embed`;
}
</script>

</body>
</html>
