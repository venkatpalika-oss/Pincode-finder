<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indian Pincode & Place Finder</title>
  <meta name="description" content="Search Indian pincodes or place names using official public postal data. Fast, accurate, and cached for better performance." />

  <!-- Google AdSense (LOAD ONCE) -->
  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9595967643816732"
    crossorigin="anonymous"></script>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
    }
    main.container {
      max-width: 720px;
      margin: 60px auto;
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 { text-align: center; margin-bottom: 10px; color: #333; }
    h2.subtitle { text-align: center; color: #666; margin-bottom: 25px; font-size: 14px; }
    input { width: 100%; padding: 14px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
    button { width: 100%; margin-top: 15px; padding: 14px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #0056b3; }
    .result { margin-top: 25px; padding: 20px; background: #f1f5ff; border-radius: 8px; display: none; }
    .error { margin-top: 20px; color: red; text-align: center; }
    footer { text-align: center; margin-top: 40px; color: #777; font-size: 14px; }
    .clear-cache { margin-top: 10px; background: #28a745; }
    .clear-cache:hover { background: #1e7e34; }

    .map-container {
      margin-top:10px;
      border-radius:6px;
      overflow:hidden;
      height:250px;
    }
    .map-container iframe {
      width:100%;
      height:100%;
      border:0;
    }

    .adsense { margin:20px 0; text-align:center; }

    .credit-card {
      background: #e6f4ea;
      padding: 20px;
      border-radius: 8px;
      margin-top: 25px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .credit-card h2 { color: #198754; margin-bottom:10px; }
    .credit-card a {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px;
      background: #198754;
      color: #fff;
      font-weight: 600;
      font-size: 16px;
      border-radius: 6px;
      text-decoration: none;
      margin-top:10px;
      animation: pulse 2.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
  </style>
</head>

<body>
<main class="container">
  <h1>Indian Pincode & Place Finder</h1>
  <h2 class="subtitle">Search by Pincode or Place Name</h2>

  <input id="search" placeholder="Enter 6-digit Pincode or Place Name">
  <button onclick="search()">Search</button>
  <button class="clear-cache" onclick="clearCache()">Clear Cache</button>

  <div class="credit-card">
    <h2>💳 Check Your Free Credit Score</h2>
    <a href="https://www.paisabazaar.com/?affid=PB005260220213" target="_blank" rel="nofollow sponsored">
      💳 Check Free Credit Score
    </a>
  </div>

  <div id="result" class="result"></div>

  <!-- In-content Ad -->
  <div id="adsense-container" class="adsense"></div>

  <div id="error" class="error"></div>
</main>

<footer>
  © 2026 Pincode Finder
  <div class="adsense">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-9595967643816732"
         data-ad-slot="9876543210"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
  </div>
</footer>

<script>
  async function search() {
    const q = search.value.trim();
    if (!q) return;

    result.innerHTML = "Loading...";
    error.textContent = "";

    const isPin = /^\d{6}$/.test(q);
    const url = isPin
      ? `https://api.postalpincode.in/pincode/${q}`
      : `https://api.postalpincode.in/postoffice/${q}`;

    const r = await fetch(url);
    const d = await r.json();

    if (d[0].Status !== "Success") {
      result.style.display = "none";
      error.textContent = "No results found";
      return;
    }

    result.innerHTML = d[0].PostOffice.map(o => `
      <div>
        <b>${o.Name}</b><br>${o.District}, ${o.State}
        <div class="map-container">
          <iframe loading="lazy"
            src="https://www.google.com/maps?q=${encodeURIComponent(o.Name + ',' + o.District)}&output=embed">
          </iframe>
        </div>
      </div>
    `).join("");

    result.style.display = "block";
    loadAd();
  }

  function loadAd() {
    adsense-container.innerHTML = `
      <ins class="adsbygoogle"
        style="display:block"
        data-ad-client="ca-pub-9595967643816732"
        data-ad-slot="1234567890"
        data-ad-format="auto"
        data-full-width-responsive="true"></ins>`;
    (adsbygoogle = window.adsbygoogle || []).push({});
  }

  function clearCache() {
    localStorage.clear();
    alert("Cache cleared");
  }

  // Initialize footer ad
  (adsbygoogle = window.adsbygoogle || []).push({});
</script>
</body>
</html>
