<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Global Postal Code Finder | PIN, ZIP & Postcodes</title>
<meta name="description" content="Search postal codes by city or code. India PIN codes, US ZIP, UK postcodes & global lookup with maps.">

<!-- ✅ Google AdSense -->
<script async
  src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXX"
  crossorigin="anonymous"></script>

<style>
:root{
  --bg:#f4f6f8;--card:#fff;--text:#222;--sub:#666;
  --primary:#007bff;--credit:#198754
}
[data-theme="dark"]{
  --bg:#121212;--card:#1e1e1e;--text:#f5f5f5;--sub:#aaa;
}
body{font-family:Arial;background:var(--bg);color:var(--text);margin:0}
.container{max-width:950px;margin:40px auto;background:var(--card);
padding:25px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
h1{text-align:center}
.subtitle{text-align:center;color:var(--sub)}
select,input,button{width:100%;padding:14px;margin-top:10px;border-radius:8px}
button{background:var(--primary);color:#fff;border:none}
.card{padding:14px;border-bottom:1px solid #ddd;cursor:pointer}
.card:hover{background:rgba(0,123,255,.08)}
.error{text-align:center;color:red;margin-top:15px}
.toggle{position:fixed;top:15px;right:15px;cursor:pointer}

.credit-side{
position:fixed;right:20px;top:120px;width:260px;
background:#e6f4ea;padding:15px;border-radius:10px
}
.credit-side a{
display:block;background:var(--credit);color:#fff;
padding:14px;border-radius:6px;text-align:center;text-decoration:none
}

@media(max-width:900px){
.credit-side{display:none}
}
</style>
</head>

<body>

<div class="toggle" onclick="toggleTheme()">🌙 / ☀️</div>

<div class="container">
<h1>🌍 Global Postal Code Finder</h1>
<p class="subtitle">India PIN • US ZIP • UK • Canada • Europe • Japan</p>

<select id="country">
<option value="IN">🇮🇳 India</option>
<option value="US">🇺🇸 United States</option>
<option value="GB">🇬🇧 United Kingdom</option>
<option value="CA">🇨🇦 Canada</option>
<option value="AU">🇦🇺 Australia</option>
<option value="DE">🇩🇪 Germany</option>
<option value="FR">🇫🇷 France</option>
<option value="JP">🇯🇵 Japan</option>
</select>

<input id="q" placeholder="Enter city or postal code">
<button onclick="search()">Search</button>

<!-- ✅ AdSense: Top placement -->
<div style="margin:20px 0;text-align:center">
<ins class="adsbygoogle"
 style="display:block"
 data-ad-client="ca-pub-XXXXXXXXXXXXXXX"
 data-ad-slot="1111111111"
 data-ad-format="auto"
 data-full-width-responsive="true"></ins>
</div>
<script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>

<div id="result"></div>
<div id="error" class="error"></div>

<hr>
<h3>🔥 Popular City Postal Codes</h3>
<div class="card" onclick="quick('IN','Mumbai')">Mumbai PIN Codes</div>
<div class="card" onclick="quick('IN','Delhi')">Delhi PIN Codes</div>
<div class="card" onclick="quick('US','New York')">New York ZIP Codes</div>
<div class="card" onclick="quick('GB','London')">London Postcodes</div>

</div>

<div class="credit-side">
<h3>💳 Free Credit Score</h3>
<a href="https://www.paisabazaar.com/?affid=PB005260220213"
target="_blank" rel="nofollow sponsored">Check Now</a>
</div>

<script>
const OPENCAGE_KEY="YOUR_OPENCAGE_KEY";

function quick(c,v){
 country.value=c; q.value=v; search();
}

async function search(){
 result.innerHTML=""; error.textContent="";
 const v=q.value.trim(); if(!v) return;
 try{
  if(country.value==="IN"){
   const u=/^\d{6}$/.test(v)?
   `https://api.postalpincode.in/pincode/${v}`:
   `https://api.postalpincode.in/postoffice/${v}`;
   const d=await (await fetch(u)).json();
   if(d[0].Status!=="Success") throw "";
   d[0].PostOffice.forEach(o=>{
    result.innerHTML+=`
    <div class="card" onclick="goIN(
    '${o.Name}','${o.Pincode}','${o.District}','${o.State}')">
    🇮🇳 <b>${o.Name}</b> – ${o.Pincode}<br>${o.District}, ${o.State}
    </div>`;
   });
   return;
  }

  const g=await (await fetch(
  `https://api.opencagedata.com/geocode/v1/json?q=${v}&countrycode=${country.value.toLowerCase()}&key=${OPENCAGE_KEY}`
  )).json();

  g.results.forEach(r=>{
   const x=r.components;
   result.innerHTML+=`
   <div class="card" onclick="goINT(
   '${country.value}','${x.postcode||""}',
   '${x.city||x.town||v}','${x.state||""}')">
   🌍 <b>${x.postcode||"Postal code not available"}</b><br>
   ${x.city||x.town||v}, ${x.state||""}
   </div>`;
  });
 }catch{ error.textContent="No results found."; }
}

function goIN(n,p,d,s){
 location.href=`detail.html?country=IN&name=${encodeURIComponent(n)}&pin=${p}&district=${encodeURIComponent(d)}&state=${encodeURIComponent(s)}`;
}
function goINT(c,p,pl,s){
 location.href=`detail.html?country=${c}&pin=${p}&place=${encodeURIComponent(pl)}&state=${encodeURIComponent(s)}`;
}
function toggleTheme(){
 document.body.dataset.theme=
 document.body.dataset.theme==="dark"?"":"dark";
 localStorage.theme=document.body.dataset.theme;
}
if(localStorage.theme==="dark") document.body.dataset.theme="dark";
</script>
</body>
</html>
