<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Global Postal Code Finder | India Pincode, ZIP & Postcode</title>
<meta name="description" content="Search Indian pincodes, US ZIP codes, UK postcodes, and global postal codes by city or code.">

<!-- AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9595967643816732" crossorigin="anonymous"></script>

<style>
body{font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;margin:0}
.container{max-width:900px;margin:50px auto;background:#fff;padding:30px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.1)}
h1{text-align:center}
.subtitle{text-align:center;color:#666;font-size:14px}
input,button{width:100%;padding:14px;font-size:16px;border-radius:6px}
input{border:1px solid #ccc}
button{margin-top:12px;background:#007bff;color:#fff;border:none;cursor:pointer}
button:hover{background:#0056b3}

.card{
background:#f1f5ff;
padding:15px;
border-radius:8px;
margin-bottom:12px;
cursor:pointer;
display:flex;
gap:10px;
align-items:center
}
.card:hover{background:#e9efff}
.flag{font-size:22px}
.error{text-align:center;color:red;margin-top:15px}

/* Credit Score Desktop */
.credit-side{
position:fixed;right:20px;top:120px;width:260px;
background:#e6f4ea;padding:15px;border-radius:10px;
box-shadow:0 4px 8px rgba(0,0,0,.15)
}
.credit-side a{
display:block;text-align:center;background:#198754;color:#fff;
padding:14px;border-radius:6px;text-decoration:none;font-weight:600
}

/* Mobile CTA */
.mobile-cta{
display:none;position:fixed;bottom:0;left:0;right:0;
background:#198754;color:#fff;text-align:center;padding:14px;
font-weight:600;text-decoration:none
}

@media(max-width:900px){
.credit-side{display:none}
.mobile-cta{display:block}
}
</style>
</head>

<body>

<div class="container">
<h1>🌍 Global Postal Code Finder</h1>
<p class="subtitle">India Pincode • US ZIP • UK Postcode • International</p>

<input id="q" placeholder="Enter city, pincode, ZIP or postcode">
<button onclick="search()">Search</button>

<div id="result"></div>
<div id="error" class="error"></div>
</div>

<!-- Credit Score Desktop -->
<div class="credit-side">
<h3>💳 Free Credit Score</h3>
<a href="https://www.paisabazaar.com/?affid=PB005260220213" target="_blank" rel="nofollow sponsored">
Check Now
</a>
</div>

<!-- Mobile CTA -->
<a class="mobile-cta" href="https://www.paisabazaar.com/?affid=PB005260220213" target="_blank">
💳 Check Free Credit Score
</a>

<script>
const OPENCAGE_KEY = "YOUR_OPENCAGE_API_KEY";

function flag(code){
  return String.fromCodePoint(...[...code.toUpperCase()].map(c=>127397+c.charCodeAt()));
}

function detectCountry(q){
  if(/^\d{6}$/.test(q)) return "IN";
  if(/^[A-Z]{1,2}\d[A-Z\d]? ?\d[A-Z]{2}$/i.test(q)) return "GB";
  if(/^\d{5}$/.test(q)) return "US";
  if(/^[A-Z]\d[A-Z] ?\d[A-Z]\d$/i.test(q)) return "CA";
  return "";
}

async function searchByCityGlobal(city){
  const url=`https://api.opencagedata.com/geocode/v1/json?q=${encodeURIComponent(city)}&key=${OPENCAGE_KEY}&limit=10`;
  const r=await fetch(url);
  const d=await r.json();
  return d.results
    .map(x=>x.components)
    .filter(c=>c.postcode && c.country_code);
}

async function search(){
  const q=document.getElementById("q").value.trim();
  const result=document.getElementById("result");
  const error=document.getElementById("error");
  result.innerHTML=""; error.textContent="";
  if(!q) return;

  try{
    const country=detectCountry(q);

    if(country==="IN"){
      const url=/^\d{6}$/.test(q)
        ?`https://api.postalpincode.in/pincode/${q}`
        :`https://api.postalpincode.in/postoffice/${encodeURIComponent(q)}`;
      const d=await (await fetch(url)).json();
      if(d[0].Status!=="Success") throw "";

      result.innerHTML=d[0].PostOffice.map(o=>`
        <div class="card" onclick="openIndia(
          '${o.Name}','${o.Pincode}','${o.District}','${o.State}'
        )">
          <span class="flag">${flag("IN")}</span>
          <div>
            <strong>${o.Name} – ${o.Pincode}</strong><br>
            ${o.District}, ${o.State}
          </div>
        </div>
      `).join("");

    }else{
      try{
        const d=await (await fetch(`https://api.zippopotam.us/${country}/${q}`)).json();
        result.innerHTML=`
          <div class="card" onclick="openIntl(
            '${country}','${d['post code']}',
            '${d.places[0]['place name']}','${d.places[0].state}'
          )">
            <span class="flag">${flag(country)}</span>
            <div>
              <strong>${d['post code']}</strong><br>
              ${d.places[0]['place name']}, ${d.places[0].state}
            </div>
          </div>`;
      }catch{
        const list=await searchByCityGlobal(q);
        result.innerHTML=list.map(p=>`
          <div class="card" onclick="openIntl(
            '${p.country_code.toUpperCase()}',
            '${p.postcode}',
            '${p.city||p.town||p.village||""}',
            '${p.state||""}'
          )">
            <span class="flag">${flag(p.country_code)}</span>
            <div>
              <strong>${p.postcode}</strong><br>
              ${(p.city||p.town||p.village||"")}, ${p.state||""}
            </div>
          </div>
        `).join("");
      }
    }
  }catch{
    error.textContent="No results found.";
  }
}

function openIndia(name,pin,district,state){
  location.href=`detail.html?country=IN&name=${encodeURIComponent(name)}&pin=${pin}&district=${encodeURIComponent(district)}&state=${encodeURIComponent(state)}`;
}
function openIntl(country,pin,place,state){
  location.href=`detail.html?country=${country}&pin=${pin}&place=${encodeURIComponent(place)}&state=${encodeURIComponent(state)}`;
}
</script>

</body>
</html>
