<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pincode, ZIP & Postal Code Finder | Global Lookup</title>
<meta name="description" content="Search postal codes worldwide. Find Indian PIN codes, US ZIP codes, UK postcodes, Canada, Australia, Europe & Japan instantly.">

<!-- Google AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9595967643816732"
crossorigin="anonymous"></script>

<style>
body { font-family: Arial, Helvetica, sans-serif; background:#f4f6f8; margin:0; }
.wrapper { display:flex; max-width:1200px; margin:40px auto; gap:20px; padding:0 15px; }
main { flex:3; background:#fff; padding:25px; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,.1); }
aside { flex:1; }

h1 { text-align:center; color:#333; }
.subtitle { text-align:center; color:#666; font-size:14px; margin-bottom:20px; }

input, button {
  width:100%; padding:14px; font-size:16px; border-radius:6px; margin-top:10px;
}
input { border:1px solid #ccc; }
button { background:#007bff; color:#fff; border:none; cursor:pointer; }
button:hover { background:#0056b3; }

.list-item {
  padding:12px; border-bottom:1px solid #ddd; cursor:pointer;
}
.list-item:hover { background:#f1f5ff; }

.result-box {
  margin-top:15px; background:#f1f5ff; padding:15px; border-radius:8px;
}

.map { margin-top:10px; height:250px; }
.map iframe { width:100%; height:100%; border:0; }

.error { color:red; margin-top:15px; text-align:center; }

/* Credit Score */
.credit-card {
  background:#e6f4ea; padding:20px; border-radius:8px;
}
.credit-card h3 { color:#198754; }
.credit-card a {
  display:block; margin-top:12px; padding:12px;
  background:#198754; color:#fff; text-align:center;
  text-decoration:none; border-radius:6px; font-weight:bold;
}

/* Mobile CTA */
.mobile-cta { display:none; }
@media (max-width:768px) {
  .wrapper { flex-direction:column; }
  aside { display:none; }

  .mobile-cta {
    display:flex; position:fixed; bottom:0; left:0; width:100%;
    background:#198754; color:#fff; padding:12px 15px;
    justify-content:space-between; align-items:center; z-index:9999;
  }
  .mobile-cta a {
    background:#fff; color:#198754; padding:10px 14px;
    border-radius:6px; text-decoration:none; font-weight:bold;
  }
  body { padding-bottom:70px; }
}
</style>
</head>

<body>

<div class="wrapper">

<main>
<h1>Global Postal Code Finder</h1>
<p class="subtitle">India PIN • US ZIP • UK • Canada • Australia • Europe • Japan</p>

<input id="query" placeholder="Enter postal code or city name">
<button onclick="search()">Search</button>

<div id="list"></div>
<div id="details"></div>
<div id="error" class="error"></div>
</main>

<aside>
  <div class="credit-card">
    <h3>💳 Free Credit Score</h3>
    <p style="font-size:14px;">
      Check your CIBIL credit score instantly.  
      Free & secure via Paisabazaar.
    </p>
    <a href="https://www.paisabazaar.com/?affid=PB005260220213"
       target="_blank" rel="nofollow sponsored">
      Check Free Credit Score
    </a>
  </div>
</aside>

</div>

<div class="mobile-cta">
  <span>💳 Free Credit Score</span>
  <a href="https://www.paisabazaar.com/?affid=PB005260220213"
     target="_blank" rel="nofollow sponsored">
    Check Now
  </a>
</div>

<script>
const zippaCountries = ["US","CA","GB","AU","DE","FR","IT","ES","NL","NZ","JP"];

async function search() {
  const q = document.getElementById("query").value.trim();
  const list = document.getElementById("list");
  const details = document.getElementById("details");
  const error = document.getElementById("error");

  list.innerHTML = ""; details.innerHTML = ""; error.textContent = "";
  if (!q) return;

  try {
    if (/^\d{6}$/.test(q) || /^[a-zA-Z\s]+$/.test(q)) {
      const url = /^\d{6}$/.test(q)
        ? `https://api.postalpincode.in/pincode/${q}`
        : `https://api.postalpincode.in/postoffice/${encodeURIComponent(q)}`;

      const res = await fetch(url);
      const data = await res.json();
      if (data[0].Status !== "Success") throw 1;

      data[0].PostOffice.forEach(o => {
        const d = document.createElement("div");
        d.className = "list-item";
        d.textContent = `${o.Name}, ${o.District} (${o.Pincode})`;
        d.onclick = () => show(o.Name, o.District + ", " + o.State);
        list.appendChild(d);
      });
      return;
    }

    for (const c of zippaCountries) {
      try {
        const res = await fetch(`https://api.zippopotam.us/${c}/${q}`);
        const data = await res.json();
        data.places.forEach(p => {
          const d = document.createElement("div");
          d.className = "list-item";
          d.textContent = `${p["place name"]}, ${p.state} (${c})`;
          d.onclick = () => show(p["place name"], p.state);
          list.appendChild(d);
        });
        return;
      } catch {}
    }

    throw 1;
  } catch {
    error.textContent = "No results found.";
  }
}

function show(place, region) {
  document.getElementById("details").innerHTML = `
    <div class="result-box">
      <strong>${place}</strong><br>${region}
      <div class="map">
        <iframe loading="lazy"
          src="https://www.google.com/maps?q=${encodeURIComponent(place + ',' + region)}&output=embed">
        </iframe>
      </div>
    </div>`;
}
</script>

</body>
</html>
